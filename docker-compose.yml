version: '3.8'

services:
  caddy:
    image: caddy:2.8-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - scout_net
    depends_on:
      - backend
      - hub

  backend:
    build: ./backend
    restart: always
    environment:
      - ADMIN_KEY=${ADMIN_KEY:?ADMIN_KEY must be set in .env}
      - DEV_ACCESS_CODE=${DEV_ACCESS_CODE:-}
      - SMTP_HOST=${SMTP_HOST:-mail.infomaniak.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-info@scoutgame.ch}
      - SMTP_PASS=${SMTP_PASS:-}
      - DB_PATH=/app/data/scoutgame.db
      - TZ=UTC
    volumes:
      - ./data:/app/data
    networks:
      - scout_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  hub:
    build: ./hub
    restart: always
    networks:
      - scout_net

  game-infiltre:
    build: ./games/infiltre
    restart: always
    networks:
      - scout_net

  game-couvrefeu:
    build: ./games/couvrefeu
    restart: always
    networks:
      - scout_net

  game-chrono:
    build: ./games/chrono
    restart: always
    networks:
      - scout_net

  game-vachao:
    build: ./games/vachao
    restart: always
    networks:
      - scout_net

  game-crise:
    build: ./games/crise
    restart: always
    networks:
      - scout_net

  game-debrief:
    build: ./games/debrief
    restart: always
    networks:
      - scout_net

  dev-cards:
    build: ./dev-cards
    restart: always
    networks:
      - scout_net

networks:
  scout_net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
